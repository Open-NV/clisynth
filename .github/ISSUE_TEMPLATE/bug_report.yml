name: Bug report
description: Report a reproducible CliSynth defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Do not include credentials or production inventory.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include a sanitized OutputFSM and inventory document.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CliSynth version
    validations:
      required: true
