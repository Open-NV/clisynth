name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit and integration tests
        run: go test -coverprofile=coverage.out ./...
      - name: Race detector
        run: go test -race ./...
      - name: Build CLI
        run: go build -trimpath ./cmd/clisynth
      - name: Validate API and schema contracts
        run: |
          npx --yes @redocly/cli@2.46.1 lint api/openapi.yaml
          jq empty schema/outputfsm.schema.json

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: clisynth:test
