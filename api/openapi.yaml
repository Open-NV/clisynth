openapi: 3.1.0
info:
  title: CliSynth API
  version: 0.1.0
  description: Deterministic synthetic network CLI output from OutputFSM definitions.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://localhost:8080
security: []
paths:
  /healthz:
    get:
      summary: Check process liveness
      operationId: health
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: {const: ok}
                  version: {type: string}
  /readyz:
    get:
      summary: Check definition readiness
      operationId: ready
      responses:
        "200":
          description: At least one definition is loaded.
          content:
            application/json:
              schema:
                type: object
                required: [status, definitions]
                properties:
                  status: {const: ready}
                  definitions: {type: integer, minimum: 1}
        "503":
          description: The service is not ready.
  /v1/definitions:
    get:
      summary: List loaded definitions
      operationId: listDefinitions
      responses:
        "200":
          description: Sorted definition catalog.
          content:
            application/json:
              schema:
                type: object
                required: [definitions, count]
                properties:
                  count: {type: integer, minimum: 0}
                  definitions:
                    type: array
                    items: {$ref: "#/components/schemas/DefinitionSummary"}
  /v1/admin/definitions:
    put:
      summary: Atomically replace the complete OutputFSM registry
      description: >-
        This route is registered only when CLISYNTH_RELOAD_TOKEN is configured.
        Authentication, complete/count/digest checks, strict YAML decoding, and
        compilation of every definition must succeed before the immutable
        registry snapshot is replaced.
      operationId: reloadDefinitions
      security:
        - reloadBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReloadBundle"}
      responses:
        "200":
          description: The complete registry snapshot was replaced atomically.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReloadResponse"}
        "400": {$ref: "#/components/responses/ErrorResponse"}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "413": {$ref: "#/components/responses/ErrorResponse"}
        "415": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
  /v1/render:
    post:
      summary: Render one device command
      operationId: render
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RenderRequest"}
      responses:
        "200":
          description: Rendered CLI output.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RenderResult"}
        "400": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
  /v1/render:batch:
    post:
      summary: Render an ordered batch
      operationId: renderBatch
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BatchRequest"}
      responses:
        "200":
          description: Ordered per-request results.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BatchResult"}
        "400": {$ref: "#/components/responses/ErrorResponse"}
  /v1/execution/render:
    post:
      summary: Execute an OpenNV emulated batch
      operationId: executeOpenNVBatch
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExecutionRequest"}
      responses:
        "200":
          description: Deterministically ordered synthetic TaskResults.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExecutionResponse"}
        "400": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
components:
  securitySchemes:
    reloadBearer:
      type: http
      scheme: bearer
      description: Dedicated high-entropy service token from CLISYNTH_RELOAD_TOKEN.
  schemas:
    ReloadBundle:
      type: object
      additionalProperties: false
      required: [apiVersion, kind, revision, complete, expectedCount, digest, definitions]
      properties:
        apiVersion: {const: clisynth.opennv.io/v1alpha1}
        kind: {const: OutputFSMBundle}
        revision:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^\S+$'
        complete: {const: true}
        expectedCount: {type: integer, minimum: 1, maximum: 100000}
        digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        definitions:
          type: array
          minItems: 1
          maxItems: 100000
          items: {$ref: "#/components/schemas/ReloadDocument"}
    ReloadDocument:
      type: object
      additionalProperties: false
      required: [source, yaml]
      properties:
        source:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '^(?!/)(?!.*(?:^|/)\.\.(?:/|$))(?!.*\\).+\.ya?ml$'
        yaml:
          type: string
          minLength: 1
          maxLength: 2097152
          description: One exact UTF-8 OutputFSM YAML document; the implementation enforces the limit in bytes.
    ReloadResponse:
      type: object
      additionalProperties: false
      required: [apiVersion, revision, count, digest]
      properties:
        apiVersion: {const: clisynth.opennv.io/v1alpha1}
        revision: {type: string, minLength: 1, maxLength: 256}
        count: {type: integer, minimum: 1, maximum: 100000}
        digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    RenderRequest:
      type: object
      additionalProperties: false
      required: [command, device]
      properties:
        platform: {type: string}
        command: {type: string, minLength: 1}
        seed: {type: integer, format: int64}
        device:
          type: object
          minProperties: 1
          additionalProperties: true
    RenderResult:
      type: object
      required: [definition, platform, command, deviceId, output]
      properties:
        definition: {type: string}
        platform: {type: string}
        command: {type: string}
        deviceId: {type: string}
        output: {type: string}
        variables: {type: object, additionalProperties: true}
    BatchRequest:
      type: object
      additionalProperties: false
      required: [requests]
      properties:
        concurrency: {type: integer, minimum: 1}
        requests:
          type: array
          minItems: 1
          maxItems: 100000
          items: {$ref: "#/components/schemas/RenderRequest"}
    BatchResult:
      type: object
      required: [results, summary]
      properties:
        results:
          type: array
          items:
            type: object
            required: [index]
            properties:
              index: {type: integer, minimum: 0}
              result: {$ref: "#/components/schemas/RenderResult"}
              error: {$ref: "#/components/schemas/ResultError"}
        summary:
          type: object
          required: [total, succeeded, failed]
          properties:
            total: {type: integer, minimum: 0}
            succeeded: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0}
    ResultError:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    DefinitionSummary:
      type: object
      required: [name, platform, command, templateVariables]
      properties:
        name: {type: string}
        version: {type: string}
        description: {type: string}
        platform: {type: string}
        platformAliases: {type: array, items: {type: string}}
        command: {type: string}
        commandAliases: {type: array, items: {type: string}}
        templateVariables: {type: array, items: {type: string}}
    ExecutionRequest:
      type: object
      additionalProperties: false
      required: [apiVersion, requestId, mode, devices, commands]
      properties:
        apiVersion: {const: v1}
        requestId: {type: string, minLength: 1, maxLength: 128}
        runId: {type: string, maxLength: 128}
        mode: {const: emulated}
        inventoryRevision: {type: string, maxLength: 256}
        packRevision: {type: string, maxLength: 256}
        devices:
          type: array
          minItems: 1
          maxItems: 10000
          items: {$ref: "#/components/schemas/ExecutionDevice"}
        commands:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 512}
        concurrency: {type: integer, minimum: 1, maximum: 10000}
        timeoutSeconds: {type: integer, minimum: 1, maximum: 3600}
        credentialRef: {type: string, maxLength: 512}
    ExecutionDevice:
      type: object
      additionalProperties: false
      required: [id, name, platform, managementAddress, role, site, status]
      properties:
        id: {type: string, minLength: 1, maxLength: 256}
        name: {type: string, minLength: 1, maxLength: 253}
        platform: {enum: [cisco_ios, cisco_iosxe, cisco_nxos, cisco_iosxr, arista_eos, juniper_junos, f5_tmos, citrix_adc]}
        managementAddress: {type: string, minLength: 1, maxLength: 255}
        role: {type: string, minLength: 1, maxLength: 128}
        site: {type: string, minLength: 1, maxLength: 128}
        status: {type: string, minLength: 1, maxLength: 64}
        osVersion: {type: [string, "null"], maxLength: 256}
        imageFile: {type: [string, "null"], maxLength: 512}
        vendor: {type: [string, "null"], maxLength: 128}
        model: {type: [string, "null"], maxLength: 256}
        serial: {type: [string, "null"], maxLength: 256}
        tags: {type: array, maxItems: 128, uniqueItems: true, items: {type: string, maxLength: 128}}
        customFields: {type: object, maxProperties: 256, additionalProperties: true}
        source:
          type: object
          additionalProperties: false
          required: [kind, recordId]
          properties:
            kind: {enum: [nautobot, netbox, file, demo]}
            recordId: {type: string, minLength: 1}
            revision: {type: [string, "null"]}
    ExecutionResponse:
      type: object
      additionalProperties: false
      required: [requestId, results]
      properties:
        requestId: {type: string}
        results:
          type: array
          items: {$ref: "#/components/schemas/ExecutionTaskResult"}
    ExecutionTaskResult:
      type: object
      additionalProperties: false
      required: [runId, taskId, deviceId, deviceName, platform, command, state, startedAt, finishedAt, attempt, backend, synthetic]
      properties:
        runId: {type: string}
        taskId: {type: string}
        deviceId: {type: string}
        deviceName: {type: string}
        platform: {type: string}
        command: {type: string}
        state: {enum: [succeeded, failed, timed_out, cancelled, unsupported]}
        output: {type: string}
        parsed: {type: object, additionalProperties: true}
        error: {$ref: "#/components/schemas/ResultError"}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        attempt: {type: integer, minimum: 1}
        backend: {const: clisynth}
        synthetic: {const: true}
  responses:
    ErrorResponse:
      description: Coded request error.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {$ref: "#/components/schemas/ResultError"}
